<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <title>Inquiries Admin · Thirupathi ENGINEERING</title>
  <link rel="stylesheet" href="admin.css">
  <style>
    .inquiry-card {
      background: var(--bg-secondary);
      border: 1px solid var(--border-hairline);
      border-radius: 8px;
      padding: 1.25rem;
      margin-bottom: 1rem;
      transition: border-color 0.2s;
    }
    .inquiry-card.unread {
      border-left: 3px solid var(--primary-teal);
    }
    .inquiry-card:hover { border-color: var(--accent-blue); }
    .inquiry-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      margin-bottom: 0.75rem;
      align-items: flex-start;
    }
    .inquiry-name {
      font-weight: 800;
      font-size: 0.97rem;
      color: var(--text-primary);
    }
    .inquiry-contact {
      font-size: 0.8rem;
      color: var(--text-muted);
    }
    .inquiry-subject {
      font-size: 0.78rem;
      font-weight: 700;
      text-transform: uppercase;
      padding: 0.2rem 0.55rem;
      background: rgba(99,102,241,0.12);
      color: #818CF8;
      border-radius: 4px;
    }
    .inquiry-message {
      font-size: 0.88rem;
      color: var(--text-secondary);
      line-height: 1.65;
      margin-bottom: 0.75rem;
    }
    .inquiry-actions {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }
    .inquiry-time {
      font-size: 0.73rem;
      color: var(--text-muted);
      margin-left: auto;
    }
  </style>
</head>

<body>

        </a>
      </div>
      <nav class="sidebar-nav">
        <div class="nav-section-title">Navigation</div>
        <a href="dashboard.html" class="nav-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg><span>Dashboard</span></a>
        <a href="hero.html" class="nav-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg><span>Hero Banner</span></a>

        <a href="projects.html" class="nav-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg><span>Projects</span></a>
        <a href="gallery.html" class="nav-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg><span>Gallery</span></a>

        <a href="profile.html" class="nav-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg><span>Profile & Skills</span></a>
        <a href="inquiries.html" class="nav-link active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg><span>Inquiries</span></a>

      </nav>
      <div class="sidebar-footer">
        <div class="user-snippet">
          <div class="user-avatar">MM</div>

          <button id="logoutBtn" title="Logout" style="background:none;border:none;color:var(--accent-rose);cursor:pointer;padding:0.4rem;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg></button>

    <main class="admin-main">
      <header class="admin-topbar">
        <div class="topbar-left">
          <button class="menu-toggle" id="sidebarToggle"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg></button>
          <div class="page-title-badge"><h1>Project Inquiries Inbox</h1></div>
        </div>
        <div class="topbar-right">
          <button class="btn btn-secondary btn-sm" onclick="loadInquiries()">↻ Refresh</button>
        </div>
      </header>

      <div class="admin-content">

        <!-- Stats -->
        <div style="display:flex; gap:1rem; margin-bottom:1.25rem; flex-wrap:wrap;">
          <div class="stat-card" style="flex:1; min-width:120px;">
            <div class="stat-info"><div class="stat-label">Total Inquiries</div><div class="stat-value" id="statTotal">0</div></div>
            <div class="stat-icon teal"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg></div>
          </div>
          <div class="stat-card" style="flex:1; min-width:120px;">
            <div class="stat-info"><div class="stat-label">Unread</div><div class="stat-value" id="statUnread" style="color:#2DD4BF;">0</div></div>
            <div class="stat-icon blue"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg></div>
          </div>
          <div class="stat-card" style="flex:1; min-width:120px;">
            <div class="stat-info"><div class="stat-label">Archived</div><div class="stat-value" id="statArchived">0</div></div>
            <div class="stat-icon indigo"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="21 8 21 21 3 21 3 8"></polyline><rect x="1" y="3" width="22" height="5"></rect><line x1="10" y1="12" x2="14" y2="12"></line></svg></div>
          </div>
        </div>

        <!-- Filter tabs -->
        <div style="display:flex; gap:0.5rem; margin-bottom:1.25rem; flex-wrap:wrap;">
          <button class="filter-btn active" id="filterAll"     onclick="setFilter('all')">All</button>
          <button class="filter-btn" id="filterUnread"  onclick="setFilter('unread')">Unread</button>
          <button class="filter-btn" id="filterRead"    onclick="setFilter('read')">Read</button>
          <button class="filter-btn" id="filterArchived" onclick="setFilter('archived')">Archived</button>
        </div>

        <!-- Inquiry cards -->
        <div id="inquiriesList">
          <div style="text-align:center; padding:3rem; color:var(--text-muted);">Loading inquiries...</div>
        </div>

      </div>
    </main>
  </div>

  <script src="admin.js"></script>
  <script>
    checkAuth();

    let allInquiries = [];
    let currentFilter = 'all';

    async function loadInquiries() {
      document.getElementById('inquiriesList').innerHTML = '<div style="text-align:center; padding:3rem; color:var(--text-muted);">Loading inquiries...</div>';
      let apiInquiries = [];
      try {
        const res = await fetch(`${API_BASE}/inquiries`, {
          credentials: 'include',
          headers: { 'Cache-Control': 'no-cache' }
        });
        const data = await res.json();
        if (data.success && Array.isArray(data.data)) {
          apiInquiries = data.data;
        }
      } catch (err) {
        console.warn('[Inquiries Admin]', err.message);
      }

      // Check LocalStorage cache
      let localInqs = [];
      try {
        const saved = localStorage.getItem('admin_cached_inquiries');
        if (saved) localInqs = JSON.parse(saved);
      } catch(e) {}

      // Combine API and local inquiries without duplicates
      const apiIds = new Set(apiInquiries.map(i => String(i._id)));
      const combined = [...apiInquiries];
      localInqs.forEach(loc => {
        if (!apiIds.has(String(loc._id))) {
          combined.unshift(loc);
        }
      });

      allInquiries = combined;
      updateStats();
      renderInquiries();
    }

    function updateStats() {
      document.getElementById('statTotal').textContent   = allInquiries.length;
      document.getElementById('statUnread').textContent  = allInquiries.filter(i => i.status === 'unread').length;
      document.getElementById('statArchived').textContent = allInquiries.filter(i => i.status === 'archived').length;
    }

    function setFilter(f) {
      currentFilter = f;
      ['All','Unread','Read','Archived'].forEach(name => {
        const btn = document.getElementById('filter' + name);
        if (btn) btn.classList.remove('active');
      });
      const active = document.getElementById('filter' + f.charAt(0).toUpperCase() + f.slice(1));
      if (active) active.classList.add('active');
      renderInquiries();
    }

    function renderInquiries() {
      const list = document.getElementById('inquiriesList');
      const filtered = currentFilter === 'all' ? allInquiries : allInquiries.filter(i => i.status === currentFilter);

      if (!filtered.length) {
        list.innerHTML = `<div style="text-align:center; padding:3rem; color:var(--text-muted);">No ${currentFilter === 'all' ? '' : currentFilter + ' '}inquiries found.</div>`;
        return;
      }

      list.innerHTML = filtered.map(inquiry => {
        const isUnread = inquiry.status === 'unread';
        const dateStr  = inquiry.createdAt ? new Date(inquiry.createdAt).toLocaleDateString('en-IN', { day:'numeric', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit' }) : '—';
        const cleanPhoneNum = inquiry.phone ? inquiry.phone.replace(/[^0-9]/g, '') : '';
        const waMsg = encodeURIComponent(`Hello ${inquiry.name || 'Client'}, this is Thirupathi Engineering regarding your inquiry for ${inquiry.subject || 'Industrial Mechanical Erection'}.`);

        return `
          <div class="inquiry-card ${isUnread ? 'unread' : ''}" id="card_${escapeHtml(inquiry._id)}">
            <div class="inquiry-meta">
              <div>
                <div class="inquiry-name" style="font-size:1.05rem; font-weight:700;">${escapeHtml(inquiry.name || 'Unknown')}</div>
                <div class="inquiry-contact">
                  ${inquiry.company ? `<strong style="color:var(--text-main);">${escapeHtml(inquiry.company)}</strong> · ` : ''}
                  ${inquiry.email ? `<a href="mailto:${escapeHtml(inquiry.email)}" style="color:var(--primary-teal);">${escapeHtml(inquiry.email)}</a>` : ''}
                  ${inquiry.phone ? ` · <a href="tel:${escapeHtml(inquiry.phone)}" style="color:var(--text-muted); font-weight:600;">${escapeHtml(inquiry.phone)}</a>` : ''}
                </div>
              </div>
              <span class="inquiry-subject" style="background:var(--bg-secondary); border:1px solid var(--border-hairline); border-radius:4px; padding:0.25rem 0.6rem;">${escapeHtml(inquiry.subject || 'General Inquiry')}</span>
              <span class="inquiry-time">${dateStr}</span>
              ${isUnread ? '<span class="badge-tag ongoing" style="font-size:0.68rem; font-weight:800;">NEW INQUIRY</span>' : ''}
            </div>
            <div class="inquiry-message" style="background:var(--bg-secondary); padding:0.85rem; border-radius:6px; margin:0.8rem 0; font-size:0.92rem; line-height:1.6;">${escapeHtml(inquiry.message || '—')}</div>
            <div class="inquiry-actions" style="display:flex; flex-wrap:wrap; gap:0.5rem; align-items:center;">
              ${cleanPhoneNum ? `<a href="https://api.whatsapp.com/send?phone=${cleanPhoneNum}&text=${waMsg}" target="_blank" class="btn btn-sm" style="background:#10B981; color:#FFFFFF; font-weight:700; text-decoration:none; padding:0.4rem 0.8rem;">💬 Chat on WhatsApp</a>` : ''}
              ${inquiry.phone ? `<a href="tel:${escapeHtml(inquiry.phone)}" class="btn btn-secondary btn-sm" style="text-decoration:none; padding:0.4rem 0.8rem;">📞 Call Client</a>` : ''}
              ${inquiry.email ? `<a href="mailto:${escapeHtml(inquiry.email)}?subject=Re: ${encodeURIComponent(inquiry.subject || 'Your Industrial Inquiry')} - Thirupathi Engineering" class="btn btn-primary btn-sm" style="text-decoration:none; padding:0.4rem 0.8rem;">✉️ Reply via Email</a>` : ''}
              ${isUnread ? `<button class="btn btn-secondary btn-sm" onclick="markStatus('${escapeHtml(inquiry._id)}', 'read')">Mark as Read</button>` : ''}
              ${inquiry.status !== 'archived' ? `<button class="btn btn-sm" style="background:rgba(99,102,241,0.12);color:#818CF8;" onclick="markStatus('${escapeHtml(inquiry._id)}', 'archived')">Archive</button>` : ''}
              <button class="btn btn-sm" style="background:rgba(239,68,68,0.12);color:#F87171;" onclick="deleteInquiry('${escapeHtml(inquiry._id)}')">Delete</button>
            </div>
          </div>
        `;
      }).join('');
    }

    async function markStatus(id, status) {
      try {
        const res = await fetch(`${API_BASE}/inquiries/${id}`, {
          method: 'PATCH',
          credentials: 'include',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ status })
        });
        const data = await res.json();
        if (data.success) {
          const item = allInquiries.find(i => String(i._id) === String(id));
          if (item) item.status = status;
          updateStats();
          renderInquiries();
          showToast(`Marked as ${status}.`, 'success');
        }
      } catch (err) {
        showToast('Error: ' + err.message, 'error');
      }
    }

    async function deleteInquiry(id) {
      if (!confirm('Delete this inquiry permanently? This cannot be undone.')) return;
      try {
        const res = await fetch(`${API_BASE}/inquiries/${id}`, {
          method: 'DELETE',
          credentials: 'include'
        });
        const data = await res.json();
        if (data.success) {
          allInquiries = allInquiries.filter(i => String(i._id) !== String(id));
          updateStats();
          renderInquiries();
          showToast('Inquiry deleted.', 'success');
        }
      } catch (err) {
        showToast('Error: ' + err.message, 'error');
      }
    }

    loadInquiries();
  </script>
</body>
